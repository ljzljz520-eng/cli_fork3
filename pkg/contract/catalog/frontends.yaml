# Built-in frontend capability contracts.
#
# Frontends are scaffolded by create-vite/create-next-app/nuxi and are not
# part of the containerized verify stack; their contracts describe the env
# glue naming and browser-origin requirements of each toolchain family.
#
# requires:
#   http-api    - a backend publishing an HTTP API (base path is bound by glue)
#   browser-api - API must be reachable from a browser (backend CORS or a
#                 same-origin ingress proxy)
---
apiVersion: cgapp.io/v1
kind: frontend
name: vanilla
display: Vanilla JS (Vite)
version: "latest"
runtime: {language: node, version: ">=20.19"}
auth: {mechanism: none}
requires:
  - {name: http-api}
  - {name: browser-api}
glue: {envFile: .env.local, apiURLEnv: VITE_API_BASE_URL, devPort: 5173}
---
